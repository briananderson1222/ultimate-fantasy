[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultimate-fantasy-backend"
version = "0.1.0"
description = "Ultimate Fantasy Platform backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Ultimate Fantasy Team" }
]
dependencies = [
  "fastapi==0.116.1",
  "sqlalchemy==2.0.43",
  "alembic==1.16.5",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "psycopg[binary]==3.2.10",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "pytest-benchmark==5.1.0",
  "pyyaml==6.0.2",
  "ruff==0.13.0",
  "black==25.1.0",
  "isort==6.0.1",
  "mypy==1.18.1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
target-version = "py311"
line-length = 88
lint.select = [
  "E","F","W","I","N","B","UP","S","C4","PIE","T20","SIM","PT","PL","RUF"
]
lint.ignore = [
  "E501"  # line length handled by formatter
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
ignore_missing_imports = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
