# Ultimate Fantasy Platform - Tmux Configuration
# Copy this to your home directory as ~/.tmux.conf for better UX

# Set prefix to Ctrl+A (more ergonomic than Ctrl+B)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Enable mouse support
set -g mouse on

# Better colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Status bar configuration
set -g status-bg colour235
set -g status-fg colour136
set -g status-left-length 20
set -g status-left '#[fg=colour16,bg=colour254,bold] #S #[fg=colour254,bg=colour235,nobold] '
set -g status-right '#[fg=colour254,bg=colour235] #(date +"%H:%M") #[fg=colour16,bg=colour254,bold] #(whoami)@#h '

# Window status
set -g window-status-format '#[fg=colour244,bg=colour235] #I #[fg=colour240] #W '
set -g window-status-current-format '#[fg=colour235,bg=colour136,bold] #I #[fg=colour235,bg=colour136] #W '

# Pane borders
set -g pane-border-fg colour235
set -g pane-border-bg colour235
set -g pane-active-border-fg colour136
set -g pane-active-border-bg colour235

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity on

# Better key bindings
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Navigate panes with hjkl
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with HJKL
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window selection
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Copy mode improvements
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi r send -X rectangle-toggle

# Don't rename windows automatically
set-option -g allow-rename off

# Increase history limit
set -g history-limit 10000

# Faster command sequences
set -s escape-time 0

# Focus events for vim
set -g focus-events on