[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultimate-fantasy-backend"
version = "0.1.0"
description = "Ultimate Fantasy Platform backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Ultimate Fantasy Team" }
]
dependencies = [
  "fastapi==0.116.1",
  "sqlalchemy==2.0.43",
  "alembic==1.16.5",
  "uvicorn[standard]==0.35.0",
  "pydantic[email]==2.11.7",
  "psycopg[binary]==3.2.10",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.9.0",
  "psycopg2-binary>=2.9.10",
  "psutil>=7.0.0",
  "pydantic-settings>=2.10.1",
  "pytest-benchmark>=5.1.0",
  # AI/ML and analytics dependencies
  "scikit-learn>=1.3.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  # Real-time features
  "redis>=5.0.0",
  "websockets>=12.0",
  "fastapi-websocket-pubsub>=0.3.0",
  # Enhanced monitoring and tracing
  "opentelemetry-api>=1.21.0",
  "opentelemetry-sdk>=1.21.0",
  "opentelemetry-instrumentation-fastapi>=0.42b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.42b0",
  "opentelemetry-exporter-jaeger>=1.21.0",
  "aiohttp>=3.12.15",
  "aiofiles>=24.1.0",
  "asyncpg>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "pytest-benchmark==5.1.0",
  "pyyaml==6.0.2",
  "ruff==0.13.0",
  "black==25.1.0",
  "isort==6.0.1",
  "mypy==1.18.1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["alembic/"]
lint.select = [
  "E","F","W","I","N","B","UP","S","C4","PIE","T20","SIM","PT","PL","RUF"
]
lint.ignore = [
  "E501",  # line length handled by formatter
  "S101",  # assert statements are fine in tests
  "PLR2004",  # magic values are fine in tests
  "N806",  # variable names are fine in tests
  "E402",  # module imports are fine in tests
  "PLC0415",  # imports in functions are fine in tests
  "RUF059",  # unused variables are fine in tests
  "RUF100",  # unused noqa is fine
  "B009",  # getattr is fine in tests
  "RUF046",  # int casting is fine
  "B008",  # FastAPI Depends() in defaults is standard pattern
  "B904",  # raise from is not always needed
  "N803",  # camelCase args are fine for API endpoints
  "PLW0603",  # global is fine for test engine
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ALL"]  # Disable all linting for test files

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
ignore_missing_imports = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
