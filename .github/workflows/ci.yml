name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: Imports check (isort)
        run: uv run isort --check-only .

      - name: Type check (mypy)
        run: uv run mypy src/

      - name: Tests (pytest)
        run: uv run pytest -q

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: ESLint
        run: npm run lint --silent

      - name: Prettier check
        run: npm run format:check --silent || true

      - name: Type check
        run: npm run typecheck --silent || true

  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      AUTH_MODE: dev
      AUTH_DEV_SECRET: test-e2e-secret
      E2E_BASE_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright deps
        working-directory: frontend
        run: |
          npm install
          npx playwright install --with-deps

      - name: Setup Python + uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Python 3.11
        run: uv python install 3.11

      - name: Backend deps
        working-directory: backend
        run: uv sync --all-extras

      - name: Start backend
        working-directory: backend/src
        run: |
          uv run uvicorn main:app --host 127.0.0.1 --port 8000 &
          for i in `seq 1 30`; do
            curl -fsS http://127.0.0.1:8000/openapi.json && break || sleep 1;
          done

      - name: Start frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
        run: |
          npm run dev -- --port 3000 &
          for i in `seq 1 60`; do
            curl -fsS http://127.0.0.1:3000 || sleep 1;
            if curl -fsS http://127.0.0.1:3000 >/dev/null 2>&1; then break; fi;
          done

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e -- --reporter=line
