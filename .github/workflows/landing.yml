name: Landing Page

on:
  push:
    branches: ["**"]
    paths:
      - "apps/landing/**"
      - ".github/workflows/landing.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "apps/landing/**"
      - ".github/workflows/landing.yml"

jobs:
  landing-test:
    name: Landing Page Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: HTML Validation
        run: |
          npm install -g html-validate
          html-validate index.html

      - name: CSS Validation
        run: |
          npm install -g css-tree-validator
          css-tree-validator style.css || true

      - name: JavaScript Lint (ESLint)
        run: |
          npm install -g eslint
          npx eslint script.js --ext .js || true

      - name: Start local server for testing
        run: |
          python3 -m http.server 8080 &
          sleep 3

      - name: Test page loads
        run: |
          curl -f http://localhost:8080/index.html || exit 1

      - name: Test static assets
        run: |
          curl -f http://localhost:8080/style.css || exit 1
          curl -f http://localhost:8080/script.js || exit 1

  landing-lighthouse:
    name: Landing Page Performance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Start local server
        run: |
          python3 -m http.server 8080 &
          sleep 3

      - name: Run Lighthouse CI
        run: |
          lhci autorun --upload.target=temporary-public-storage --collect.url=http://localhost:8080

  landing-deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Surge.sh (Preview)
        run: |
          npm install -g surge
          surge . --domain ultimate-fantasy-pr-${{ github.event.number }}.surge.sh --token ${{ secrets.SURGE_TOKEN || 'skip' }}

      - name: Comment PR with preview link
        if: env.SURGE_TOKEN != 'skip'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Landing page preview: https://ultimate-fantasy-pr-${{ github.event.number }}.surge.sh'
            })