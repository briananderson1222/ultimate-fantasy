name: Mobile (React Native)

on:
  push:
    branches: ["**"]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - ".github/workflows/mobile.yml"

jobs:
  mobile-test:
    name: Mobile Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: cd ../.. && npm ci

      - name: Build shared packages
        run: cd ../.. && npm run build:packages

      - name: Install mobile dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (Jest)
        run: npm test

  mobile-build:
    name: Mobile Build Test
    runs-on: ubuntu-latest
    needs: mobile-test
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Expo CLI
        run: npm install -g @expo/cli

      - name: Install root dependencies
        run: cd ../.. && npm ci

      - name: Build shared packages
        run: cd ../.. && npm run build:packages

      - name: Install mobile dependencies
        run: npm ci

      - name: Expo build check
        run: npx expo export --platform web --output-dir dist

  mobile-e2e:
    name: Mobile E2E Tests (Detox)
    runs-on: macos-latest
    needs: mobile-test
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: cd ../.. && npm ci

      - name: Build shared packages
        run: cd ../.. && npm run build:packages

      - name: Install mobile dependencies
        run: npm ci

      - name: Setup iOS Simulator
        run: |
          xcrun simctl boot "iPhone 15" || true
          xcrun simctl list devices

      - name: Build for Detox
        run: |
          npx detox build --configuration ios.sim.debug

      - name: Run Detox E2E tests
        run: |
          npx detox test --configuration ios.sim.debug --cleanup